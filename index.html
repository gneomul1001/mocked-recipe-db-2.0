<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모크드 레시피 2.0 - 홈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#F3F4F6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='index.html'">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">모크드 레시피 <span class="text-indigo-600">2.0</span></span>
            </div>
            <nav class="flex space-x-1 sm:space-x-4">
                <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-indigo-600 bg-indigo-50">홈</a>
                <a href="recipes.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-600 hover:text-indigo-600 hover:bg-slate-100">레시피</a>
                <a href="database.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-600 hover:text-indigo-600 hover:bg-slate-100">데이터베이스</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-8 sm:p-12 text-white shadow-xl shadow-indigo-100 flex flex-col md:flex-row items-center justify-between">
            <div class="space-y-4 max-w-xl text-center md:text-left">
                <span class="bg-indigo-500/50 text-indigo-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Mocked Recipe 2.0</span>
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight">가장 세련된 가짜 레시피 관리 플랫폼</h1>
                <p class="text-indigo-100 text-sm sm:text-base leading-relaxed">방대한 카테고리와 함께 레시피를 추가, 수정, 삭제하고 스마트하게 검색해보세요.</p>
                <div class="pt-2 flex justify-center md:justify-start gap-4">
                    <button onclick="location.href='recipes.html'" class="bg-white text-indigo-600 px-6 py-3 rounded-xl font-semibold shadow-md hover:bg-indigo-50 transition-all">레시피 둘러보기</button>
                    <button onclick="location.href='database.html'" class="bg-indigo-700/60 border border-indigo-400/30 text-white px-6 py-3 rounded-xl font-semibold hover:bg-indigo-700 transition-all">데이터베이스 관리</button>
                </div>
            </div>
            <div class="mt-8 md:mt-0 text-indigo-200 text-8xl sm:text-9xl opacity-80">
                <i class="fa-solid fa-book-open-reader"></i>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-4">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900 mb-1">방대한 카테고리</h3>
                <p class="text-slate-500 text-sm">전 세계 요리부터 전통, 현대 요리까지 세분화된 카테고리를 관리합니다.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-4">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900 mb-1">레시피 관리</h3>
                <p class="text-slate-500 text-sm">원하는 레시피를 자유롭게 등록하고 수정 및 삭제할 수 있습니다.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-4">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900 mb-1">스마트 검색</h3>
                <p class="text-slate-500 text-sm">키워드 하나로 원하는 요리와 카테고리를 즉시 찾아냅니다.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-400">
            &copy; 2026 모크드 레시피 2.0. All rights reserved.
        </div>
    </footer>
</body>
</html>
