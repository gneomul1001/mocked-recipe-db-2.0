<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모크드 레시피 2.0 - 레시피 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#F3F4F6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='index.html'">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">모크드 레시피 <span class="text-indigo-600">2.0</span></span>
            </div>
            <nav class="flex space-x-1 sm:space-x-4">
                <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-600 hover:text-indigo-600 hover:bg-slate-100">홈</a>
                <a href="recipes.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-indigo-600 bg-indigo-50">레시피</a>
                <a href="database.html" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-600 hover:text-indigo-600 hover:bg-slate-100">데이터베이스</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- 상단 타이틀 및 추가 버튼 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">레시피 목록</h1>
                <p class="text-slate-500 text-sm mt-1">등록된 레시피를 조회하고 수정하거나 삭제할 수 있습니다.</p>
            </div>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md shadow-indigo-100 transition-all flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> 새 레시피 추가
            </button>
        </div>

        <!-- 검색바 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
            <i class="fa-solid fa-magnifying-glass text-slate-400 ml-2"></i>
            <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="레시피 이름 또는 카테고리 검색..." class="w-full bg-transparent border-none focus:outline-none text-slate-800 placeholder-slate-400 text-sm">
        </div>

        <!-- 레시피 카드 그리드 -->
        <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 자바스크립트로 동적 생성됨 -->
        </div>
    </main>

    <!-- 레시피 추가/수정 모달 -->
    <div id="recipeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-bold text-slate-900">새 레시피 추가</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-4">
                <input type="hidden" id="recipeId">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">레시피 이름</label>
                    <input type="text" id="recipeName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm" placeholder="예: 김치찌개">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">카테고리</label>
                    <input type="text" id="recipeCategory" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm" placeholder="예: 한식">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">설명 및 요약</label>
                    <textarea id="recipeDesc" rows="3" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm resize-none" placeholder="레시피에 대한 간단한 설명을 적어주세요."></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 font-semibold text-slate-600 hover:bg-slate-50 transition-all text-sm">취소</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition-all text-sm shadow-md shadow-indigo-100">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-400">
            &copy; 2026 모크드 레시피 2.0. All rights reserved.
        </div>
    </footer>

    <!-- JavaScript 로직 -->
    <script>
        // 초기 샘플 데이터 (localStorage에 데이터가 없을 경우 사용)
        const defaultRecipes = [
            { id: 1, name: '매콤달콤 떡볶이', category: '분식', desc: '국민 간식! 매콤하고 달콤한 소스가 일품인 떡볶이 레시피입니다.' },
            { id: 2, name: '정통 까르보나라', category: '양식', desc: '크림 없이 계란 노른자와 치즈로만 맛을 낸 이탈리아 정통 파스타입니다.' },
            { id: 3, name: '바삭한 치킨가스', category: '일식', desc: '집에서도 바삭하게 튀겨낼 수 있는 수제 치킨가스 만들기.' }
        ];

        // 로컬 스토리지에서 데이터 불러오기 또는 초기화
        let recipes = JSON.parse(localStorage.getItem('mocked_recipes')) || defaultRecipes;

        // 페이지 로드시 목록 렌더링
        window.onload = function() {
            renderRecipes(recipes);
        };

        // 레시피 목록 렌더링 함수
        function renderRecipes(data) {
            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">등록된 레시피가 없습니다.</div>`;
                return;
            }

            data.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-4 hover:shadow-md transition-all";
                card.innerHTML = `
                    <div class="space-y-2">
                        <span class="bg-indigo-50 text-indigo-600 text-xs font-semibold px-3 py-1 rounded-full">${recipe.category}</span>
                        <h3 class="text-lg font-bold text-slate-900">${recipe.name}</h3>
                        <p class="text-slate-500 text-sm leading-relaxed">${recipe.desc}</p>
                    </div>
                    <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-100">
                        <button onclick="openEditModal(${recipe.id})" class="px-3.5 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 text-xs font-semibold transition-all">
                            <i class="fa-solid fa-pen mr-1"></i> 수정
                        </button>
                        <button onclick="deleteRecipe(${recipe.id})" class="px-3.5 py-1.5 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs font-semibold transition-all">
                            <i class="fa-solid fa-trash mr-1"></i> 삭제
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 검색 필터링 기능
        function filterRecipes() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = recipes.filter(r => 
                r.name.toLowerCase().includes(keyword) || r.category.toLowerCase().includes(keyword)
            );
            renderRecipes(filtered);
        }

        // 모달 열기 (추가 모드)
        function openAddModal() {
            document.getElementById('modalTitle').innerText = '새 레시피 추가';
            document.getElementById('recipeId').value = '';
            document.getElementById('recipeName').value = '';
            document.getElementById('recipeCategory').value = '';
            document.getElementById('recipeDesc').value = '';
            document.getElementById('recipeModal').classList.remove('hidden');
            document.getElementById('recipeModal').classList.add('flex');
        }

        // 모달 열기 (수정 모드)
        function openEditModal(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            document.getElementById('modalTitle').innerText = '레시피 수정';
            document.getElementById('recipeId').value = recipe.id;
            document.getElementById('recipeName').value = recipe.name;
            document.getElementById('recipeCategory').value = recipe.category;
            document.getElementById('recipeDesc').value = recipe.desc;

            document.getElementById('recipeModal').classList.remove('hidden');
            document.getElementById('recipeModal').classList.add('flex');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('recipeModal').classList.remove('flex');
            document.getElementById('recipeModal').classList.add('hidden');
        }

        // 레시피 저장 (추가 및 수정 공용)
        function saveRecipe(event) {
            event.preventDefault();
            const id = document.getElementById('recipeId').value;
            const name = document.getElementById('recipeName').value;
            const category = document.getElementById('recipeCategory').value;
            const desc = document.getElementById('recipeDesc').value;

            if (id) {
                // 수정
                recipes = recipes.map(r => r.id == id ? { id: Number(id), name, category, desc } : r);
            } else {
                // 추가
                const newId = recipes.length > 0 ? Math.max(...recipes.map(r => r.id)) + 1 : 1;
                recipes.push({ id: newId, name, category, desc });
            }

            // LocalStorage 저장 및 UI 갱신
            localStorage.setItem('mocked_recipes', JSON.stringify(recipes));
            renderRecipes(recipes);
            closeModal();
        }

        // 레시피 삭제 기능
        function deleteRecipe(id) {
            if (confirm('정말로 이 레시피를 삭제하시겠습니까?')) {
                recipes = recipes.filter(r => r.id !== id);
                localStorage.setItem('mocked_recipes', JSON.stringify(recipes));
                renderRecipes(recipes);
            }
        }
    </script>
</body>
</html>
